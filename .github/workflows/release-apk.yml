name: Verify and publish signed APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: tripplanner-release
  cancel-in-progress: false

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - name: Verify signed deliverable
        shell: bash
        run: |
          python3 - <<'PY' >> "$GITHUB_ENV"
          import re
          from pathlib import Path
          source = Path("app/build.gradle.kts").read_text()
          print("APP_VERSION=" + re.search(r'versionName\s*=\s*"([^"]+)"', source).group(1))
          print("APP_BUILD=" + re.search(r'versionCode\s*=\s*(\d+)', source).group(1))
          PY
      - name: Prepare verified APK
        shell: bash
        run: |
          tools="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$tools/apksigner" verify --verbose --print-certs TripPlanner-debug.apk > signing.txt
          grep -qi 'certificate SHA-256 digest: 6afe635f1eeb6ae2def13bfdd671fee6e1103cb9ca09113d4b1826de433a092d' signing.txt
          "$tools/aapt" dump badging TripPlanner-debug.apk > apk-metadata.txt
          grep -q "name='com.tripplanner.app' versionCode='$APP_BUILD' versionName='$APP_VERSION'" apk-metadata.txt
          mkdir -p release
          cp TripPlanner-debug.apk "release/TripPlanner-v$APP_VERSION-build-$APP_BUILD-debug.apk"
          sha256sum release/*.apk > release/SHA256SUMS.txt
      - name: Publish signed release
        uses: ncipollo/release-action@v1
        with:
          tag: v${{ env.APP_VERSION }}
          name: Trip Planner v${{ env.APP_VERSION }} (Build ${{ env.APP_BUILD }})
          body: |
            Verified Android APK with the original signing certificate for in-place updates.
            Version ${{ env.APP_VERSION }}, build ${{ env.APP_BUILD }}.
            See docs/redesign.md for functionality and verification details.
          artifacts: release/*.apk,release/SHA256SUMS.txt
          allowUpdates: true
          replacesArtifacts: true
          makeLatest: true
